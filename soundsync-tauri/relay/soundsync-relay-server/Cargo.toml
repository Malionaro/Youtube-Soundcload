[package]
name = "soundsync-relay-server"
version = "2.6.0"
description = "Kostenloser selbstgehosteter Koordinator/Relay für SoundSync Team-Mode (P2P). Kein Tauri."
edition = "2021"

[[bin]]
name = "soundsync-relay"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
